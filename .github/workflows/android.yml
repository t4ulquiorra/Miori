name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture'
        required: false
        default: 'arm64'
        type: choice
        options:
          - 'arm64'
          - 'all'

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        touch local.properties
        [ -n "${{ secrets.LASTFM_API_KEY }}" ] && echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
        [ -n "${{ secrets.LASTFM_SECRET }}" ] && echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        [ -n "${{ secrets.LISTEN_TOGETHER_SERVER }}" ] && echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
        [ -n "${{ secrets.ADDON_AUTH_SERVER }}" ] && echo "ADDON_AUTH_SERVER=${{ secrets.ADDON_AUTH_SERVER }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > keystore.properties
        else
          echo "::warning::Using temporary self-signed keystore fallback"
          keytool -genkeypair -v -keystore release.jks -alias miori -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Miori, OU=Music, O=Miori, L=City, ST=State, C=US"
          printf 'storeFile=release.jks\nstorePassword=android\nkeyAlias=miori\nkeyPassword=android\n' > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew :app:assembleProdRelease -Pmiori.bundleWear=false

    - name: Verify Generated APKs
      run: ls -lh app/build/outputs/apk/prod/release/

    - name: Upload arm64 APK Artifact
      if: ${{ inputs.arch == 'arm64' || github.event_name != 'workflow_dispatch' || inputs.arch == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: miori-arm64-v8a-release
        path: app/build/outputs/apk/prod/release/*arm64*.apk

    - name: Upload All APK Artifacts
      if: ${{ inputs.arch == 'all' }}
      uses: actions/upload-artifact@v4
      with:
        name: miori-prod-release-all
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Upload Wear OS APK Artifact
      if: ${{ inputs.arch == 'all' && hashFiles('wearos/**') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: miori-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    - name: Secure Cleanup
      if: always()
      run: rm -f release.jks keystore.properties local.properties
